name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:   # lets you press "Run workflow" by hand

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Works two ways: project files uploaded as-is, OR just a zip of the project in the repo.
      - name: Find the project (unzip if needed)
        run: |
          if [ -f gradlew ]; then
            dir=.
          else
            zip=wickwatch1.zip
            [ -f "$zip" ] || zip=$(ls -1 *.zip 2>/dev/null | sort -V | tail -n 1)
            if [ -z "$zip" ]; then echo "No project files and no zip found in the repo"; exit 1; fi
            echo "Using $zip"
            mkdir -p _proj
            unzip -q "$zip" -d _proj
            dir=$(dirname "$(find _proj -name gradlew | head -n 1)")
          fi
          echo "PROJECT_DIR=$dir" >> "$GITHUB_ENV"

      # "shell: bash" turns on pipefail, so a failed build shows a RED cross.
      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wickwatch-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk

      # If the build failed: put just the errors on the run's Summary page (easy to screenshot) ...
      - name: Show the build errors
        if: failure()
        shell: bash
        run: |
          cd "$PROJECT_DIR" 2>/dev/null || true
          {
            echo '### Build errors'
            echo '```'
            grep -E '^e: |error:|What went wrong' -A3 build.log 2>/dev/null | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ... and keep the full log as a download.
      - name: Upload build log if the build failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.PROJECT_DIR }}/build.log
